# docs/09 §10 — build, then run the M0 gates on every push.
#
# The determinism gate in particular only earns its keep if it runs continuously:
# a float divergence introduced today is trivial to find, and nearly impossible to
# find three months later.

name: gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Install Godot (mono)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -sSLo godot.zip "${BASE}/${NAME}.zip"
          unzip -q godot.zip
          mv "${NAME}" bin

      - name: Build
        run: dotnet build CultistOfCthulhu.csproj -v q --nologo

      - name: Import project
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . --import

      # Content gate — every .tres must satisfy the readability contract (docs/05 §1)
      # and the design invariants Fable's review found broken by hand. These are all
      # invisible in isolation and only surface as "the game feels unfair" weeks later.
      - name: Content validation
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/ContentValidator.tscn

      # Ascension is the one system where a balance mistake is an EXPLOIT rather than a
      # tuning issue — it grants invulnerability. These are correctness tests.
      - name: Ascension invariants
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/AscensionTest.tscn

      - name: Banish
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/BanishTest.tscn

      # A whole run, played headlessly: every room cleared, the boss killed, the floor
      # completed, the build carried down a stair, the run ended. No other gate here can
      # reach a boss at all — they leave the player standing in the entrance for 600 frames.
      # The three-floor pass is what proves a descent does not silently reset the run.
      - name: Autorun — a complete run
        run: |
          ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . \
            res://scenes/debug/FloorRunner.tscn --seed ci --autorun --quit-after 40000
          ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . \
            res://scenes/debug/FloorRunner.tscn --seed ci --autorun --floors=3 --quit-after 60000

      # A boss that never leaves phase 1, or whose pattern player sticks in Telegraph, boots
      # cleanly and passes every other gate here. The assertions are about behaviour over
      # time — every phase reached, every phase firing, the grab connecting, the fight
      # ending — because "wired up, throws nothing, completely inert" is this project's
      # recurring failure and nothing at rest detects it.
      - name: Boss 1
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/BossTest.tscn

      # Bullets and enemies simulate their own movement and never touch Godot's physics
      # server, so nothing else here notices when they walk through walls — and for a
      # milestone, nothing did. A positional invariant, not a visual one: after any number
      # of ticks, nothing may occupy solid ground.
      - name: Wall collision
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/WallCollisionTest.tscn

      # docs/09 §9 — 10,000 seeds, every invariant from docs/06 §5.5 asserted. A
      # procedural generator without this ships failures that reach players as "the game
      # is broken and I don't know why".
      - name: Floor generation sweep
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/GenerationTest.tscn

      # The generator and the combat slice must actually boot TOGETHER. The sweep proves
      # floors are valid and the arena proves combat works; neither catches the two being
      # wired up wrongly, which is exactly how the generator sat unconnected for a
      # milestone.
      - name: Playable floor smoke
        run: |
          for s in 1 7 99 cthulhu; do
            ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . \
              res://scenes/debug/FloorRunner.tscn --seed "$s" --quit-after 600 || exit 1
          done

      # M1 smoke — the arena must survive a headless run without crashing (docs/09 §9).
      - name: M1 smoke — combat arena
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/CombatArena.tscn --seed ci --quit-after 1800

      # Gate 1 — 4096 bullets. Budgets in docs/09 §8.
      # CI runners are noisy shared hardware, so this gates on p99, not max.
      - name: M0 gate — bullet performance
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/Benchmark.tscn --seed ci

      # Gate 2 — determinism. Must never be allowed to go red and stay red.
      - name: M0 gate — determinism
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/DeterminismTest.tscn --seed ci

      # Same test, several seeds. Determinism bugs are often seed-dependent.
      - name: M0 gate — determinism across seeds
        run: |
          for s in 1 2 99 cthulhu dagon nyarlathotep; do
            echo "--- seed $s ---"
            ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . \
              res://scenes/debug/DeterminismTest.tscn --seed "$s" || exit 1
          done
