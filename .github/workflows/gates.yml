# docs/09 §10 — build, then run the M0 gates on every push.
#
# The determinism gate in particular only earns its keep if it runs continuously:
# a float divergence introduced today is trivial to find, and nearly impossible to
# find three months later.

name: gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7-stable
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux

      - name: Install Godot (mono)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          NAME="Godot_v${GODOT_VERSION}_mono_linux_x86_64"
          curl -sSLo godot.zip "${BASE}/${NAME}.zip"
          unzip -q godot.zip
          mv "${NAME}" bin

      - name: Build
        run: dotnet build CultistOfCthulhu.csproj -v q --nologo

      - name: Import project
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . --import

      # Content gate — every .tres must satisfy the readability contract (docs/05 §1)
      # and the design invariants Fable's review found broken by hand. These are all
      # invisible in isolation and only surface as "the game feels unfair" weeks later.
      - name: Content validation
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/ContentValidator.tscn

      # Ascension is the one system where a balance mistake is an EXPLOIT rather than a
      # tuning issue — it grants invulnerability. These are correctness tests.
      - name: Ascension invariants
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/AscensionTest.tscn

      - name: Banish
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/BanishTest.tscn

      # M1 smoke — the arena must survive a headless run without crashing (docs/09 §9).
      - name: M1 smoke — combat arena
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/CombatArena.tscn --seed ci --quit-after 1800

      # Gate 1 — 4096 bullets. Budgets in docs/09 §8.
      # CI runners are noisy shared hardware, so this gates on p99, not max.
      - name: M0 gate — bullet performance
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/Benchmark.tscn --seed ci

      # Gate 2 — determinism. Must never be allowed to go red and stay red.
      - name: M0 gate — determinism
        run: ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . res://scenes/debug/DeterminismTest.tscn --seed ci

      # Same test, several seeds. Determinism bugs are often seed-dependent.
      - name: M0 gate — determinism across seeds
        run: |
          for s in 1 2 99 cthulhu dagon nyarlathotep; do
            echo "--- seed $s ---"
            ~/godot/bin/Godot_v${GODOT_VERSION}_mono_linux.x86_64 --headless --path . \
              res://scenes/debug/DeterminismTest.tscn --seed "$s" || exit 1
          done
